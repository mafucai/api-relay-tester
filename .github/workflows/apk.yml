name: RelayScope APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build release APK
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease
      - name: Sign release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS_NAME: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          # 固定正式签名：从 Secrets 还原 keystore（覆盖安装、数据不丢的前提）
          echo -n "${KEYSTORE_B64}" | base64 -d > release-fixed.jks
          test -s release-fixed.jks
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/relayscope-release.apk"
          test -f "${UNSIGNED}"
          "${SDK_BUILD_TOOLS}/apksigner" sign \
            --ks release-fixed.jks --ks-pass "pass:${KEYSTORE_PASS}" \
            --ks-key-alias "${KEYSTORE_ALIAS_NAME}" \
            --key-pass "pass:${KEYSTORE_PASS}" --out "${SIGNED}" "${UNSIGNED}"
          "${SDK_BUILD_TOOLS}/apksigner" verify "${SIGNED}"
          "${SDK_BUILD_TOOLS}/apksigner" verify --print-certs "${SIGNED}" | head -4
          rm -f release-fixed.jks
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relayscope-apk
          path: app/build/outputs/apk/release/relayscope-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "${TAG}" \
            app/build/outputs/apk/release/relayscope-release.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "RelayScope ${TAG}" \
            --notes "云端构建 APK。此版本使用 CI 临时签名，仅用于首次安装验证。"
