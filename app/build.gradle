plugins { id 'com.android.application' }

android {
    namespace 'com.mafucai.relayscope'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mafucai.relayscope'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1'
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
